<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Simple page to redirect to the PDF CV -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=https://drive.proton.me/urls/DA16QRBEEG#hhd11EGTcG3J">
    <title id="page-title">Mi CV - Redirección</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <style>
        :root {
            --bg-primary: #bdbdbd;
            --bg-secondary: #aaaaaa;
            --text-color: #333;
            --shadow-light: rgba(0, 0, 0, 0.1);
            --shadow-dark: rgba(0, 0, 0, 0.2);
        }

        body.dark {
            --bg-primary: #222;
            --bg-secondary: #444;
            --text-color: #f5f5f5;
            --shadow-light: rgba(0, 0, 0, 0.3);
            --shadow-dark: rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: 4px 4px 8px var(--shadow-light);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
            color: var(--text-color);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 700;
            font-family: monospace;
            text-shadow: 2px 2px 4px var(--shadow-light);
        }

        p {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .loader {
            width: 50px;
            height: 50px;
            margin: 1.5rem auto;
            border: 4px solid var(--shadow-light);
            border-top: 4px solid var(--text-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 2rem;
            background-color: var(--bg-primary);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 8px;
            border: 2px solid var(--text-color);
            transition: all 0.3s ease;
            font-weight: 600;
            font-family: monospace;
            box-shadow: 3px 3px 5px var(--shadow-light);
        }

        .link:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 8px var(--shadow-dark);
            background-color: var(--text-color);
            color: var(--bg-primary);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .text-small {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 1.5rem;
        }

        .text-small i {
            margin-right: 0.5rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .icon {
                font-size: 3rem;
            }

            p {
                font-size: 0.9rem;
            }

            .link {
                padding: 0.6rem 1.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body class="dark">
    <div class="container">
        <div class="icon">
            <i class="bi bi-file-earmark-person-fill"></i>
        </div>
        
        <h1 id="title">Mi CV</h1>
        
        <div class="loader"></div>
        
        <p id="redirecting">Redirigiendo...</p>
        <a href="https://drive.proton.me/urls/TTMMFM3E8M#MspGCID6Qlhb" class="link">
            <i class="bi bi-download"></i> <span id="download-text">Descargar CV</span>
        </a>
        
        <p class="text-small">
            <i class="bi bi-shield-check"></i> <span id="secure-text">Enlace seguro a Proton Drive</span>
        </p>
    </div>

    <script>
        const translations = {
            es: {
                pageTitle: "Mi CV - Redirección",
                title: "Mi CV",
                redirecting: "Redirigiendo...",
                downloadText: "Descargar CV",
                secureText: "Enlace seguro a Proton Drive"
            },
            en: {
                pageTitle: "My CV - Redirect",
                title: "My CV",
                redirecting: "Redirecting...",
                downloadText: "Download CV",
                secureText: "Secure link to Proton Drive"
            }
        };

        const isSpanish = navigator.language.toLowerCase().startsWith("es");
        const lang = isSpanish ? "es" : "en";
        const texts = translations[lang];

        document.getElementById("page-title").textContent = texts.pageTitle;
        document.getElementById("title").textContent = texts.title;
        document.getElementById("redirecting").textContent = texts.redirecting;
        document.getElementById("download-text").textContent = texts.downloadText;
        document.getElementById("secure-text").textContent = texts.secureText;
        document.documentElement.lang = lang;

        const savedTheme = localStorage.getItem("jidev_theme") || "dark";
        document.body.classList.toggle("dark", savedTheme === "dark");

        setTimeout(() => {
            location.replace("https://drive.proton.me/urls/TTMMFM3E8M#MspGCID6Qlhb");
        }, 2500);
    </script>
</body>
</html>
